name: Publish

# Publishes @blocklify/preview when a version tag is pushed (e.g. v0.2.3).
# Requires an npm Trusted Publisher for this repo + workflow filename `publish.yml`:
# https://www.npmjs.com/package/@blocklify/preview → Settings → Trusted Publisher

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing git tag to publish (e.g. v0.2.3). Leave empty to publish the current package.json version from main."
        required: false
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          # Do not set registry-url — that injects a token and blocks npm OIDC.

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Test
        run: bun test

      - name: Check tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          TAG="${TAG#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag v$TAG does not match package.json version $PKG"
            exit 1
          fi

      - name: Publish to npm
        run: npm publish --access public --provenance
